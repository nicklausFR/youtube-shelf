<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Channel Shelf</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151515;
        --line: #343434;
        --text: #f2f2f2;
        --muted: #a9a9a9;
        --accent: #ff4e45;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        gap: 12px;
        min-height: 100vh;
        padding: 18px;
      }
      h1 {
        font-size: 18px;
        font-weight: 650;
        margin: 0;
      }
      p {
        color: var(--muted);
        margin: 0;
      }
      .actions {
        display: grid;
        gap: 8px;
      }
      button {
        align-items: center;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        font: inherit;
        justify-content: center;
        min-height: 38px;
        padding: 0 14px;
        white-space: normal;
      }
      button:hover { border-color: #666; }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .danger { color: #ff736d; }
      input[type="file"] { display: none; }
      #status {
        font-size: 13px;
        min-height: 18px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Import FreeTube</h1>
      <p id="description"></p>
      <div id="actions" class="actions"></div>
      <p id="status"></p>
    </main>
    <script src="data-popup.js" type="module"></script>
  </body>
</html>
